name: Ingestion pipeline
on:
  push:
    paths:
      - 'server/**'
      - 'client/**'
      - 'tests/test_*.py'
      - 'compose.yaml'
      - '.github/workflows/ingestion.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'client/**'
      - 'tests/test_*.py'
      - 'compose.yaml'
      - '.github/workflows/ingestion.yml'
jobs:
  ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test stdlib Python implementation
        run: |
          python -m compileall -q server client tests
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate shared API Compose config
        run: |
          printf 'UCAP_API_TOKEN=ci-only-placeholder-not-real\n' > .env
          docker compose config --quiet
          docker compose config --format json | python3 -c 'import json,sys; s=json.load(sys.stdin)["services"]; assert set(s)=={"ingest"}, s.keys(); v={m["target"]:m for m in s["ingest"]["volumes"]}; assert v["/nav-data"]["read_only"] is True; assert v["/data"]["read_only"] is not True'
      - name: Docker image build
        run: docker build -f server/Dockerfile -t unifiedcapture-ingest:test .
