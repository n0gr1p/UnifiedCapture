name: Ingestion pipeline
on:
  push:
    paths:
      - 'server/**'
      - 'scripts/mine_zone247_pilot.sh'
      - 'scripts/preview_zone247_candidate.sh'
      - 'scripts/export_nav_mvp_pilot.sh'
      - 'scripts/export_nav_mvp_route.py'
      - 'client/**'
      - 'tests/test_*.py'
      - 'compose.yaml'
      - '.github/workflows/ingestion.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'client/**'
      - 'tests/test_*.py'
      - 'compose.yaml'
      - '.github/workflows/ingestion.yml'
jobs:
  ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test stdlib Python implementation
        run: |
          python -m compileall -q server client tests
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check navigation pilot shell syntax
        run: bash -n scripts/mine_zone247_pilot.sh
      - name: Check route preview shell syntax
        run: bash -n scripts/preview_zone247_candidate.sh
      - name: Check navigation MVP exporter shell syntax
        run: bash -n scripts/export_nav_mvp_pilot.sh
      - name: Docker image build
        run: docker build -f server/Dockerfile -t unifiedcapture-ingest:test .
