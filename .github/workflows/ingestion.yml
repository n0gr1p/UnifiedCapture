name: Ingestion pipeline
on:
  push:
    paths:
      - 'server/**'
      - 'client/**'
      - 'tests/test_ingestion.py'
      - 'compose.yaml'
      - '.github/workflows/ingestion.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'client/**'
      - 'tests/test_ingestion.py'
      - 'compose.yaml'
      - '.github/workflows/ingestion.yml'
jobs:
  ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test stdlib Python implementation
        run: |
          python -m compileall -q server client tests/test_ingestion.py
          python -m unittest discover -s tests -p 'test_ingestion.py' -v
      - name: Docker image build
        run: docker build -f server/Dockerfile -t unifiedcapture-ingest:test .
