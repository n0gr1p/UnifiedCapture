name: Ingestion pipeline
on:
  push:
    paths:
      - 'server/**'
      - 'client/**'
      - 'tests/test_*.py'
      - 'compose.yaml'
      - '.github/workflows/ingestion.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'client/**'
      - 'tests/test_*.py'
      - 'compose.yaml'
      - '.github/workflows/ingestion.yml'
jobs:
  ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test stdlib Python implementation
        run: |
          python -m compileall -q server client tests
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate two-service Compose config
        run: |
          printf 'UCAP_API_TOKEN=ci-only-placeholder-not-real\n' > .env
          printf 'UC_NAV_QUERY_TOKEN=ci-only-placeholder-with-length-32\n' > nav-query-test.env
          UCAP_NAV_ENV_FILE=./nav-query-test.env docker compose config --quiet
      - name: Docker image build
        run: |
          docker build -f server/Dockerfile -t unifiedcapture-ingest:test .
          docker build -f server/Dockerfile.nav-query -t unifiedcapture-nav-query:test .
